# 测试专用配置:资源绑定与 wrangler.toml 保持一致,外加测试专用 [vars]。
# (POC1 的 [ai] binding 已随 POC 移除;若将来 wrangler.toml 加入 vitest-pool-workers
#  本地跑不了的绑定(如 Workers AI),在此文件中去掉即可,勿动生产配置。)
name = "dotvocab"
main = "src/index.ts"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]

# 测试专用 vars：与 test/helpers.ts 的 adminToken 保持一致（生产用 wrangler secret，勿在此放真实 token）。
[vars]
ADMIN_TOKEN = "test-admin-token"

[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"

[[d1_databases]]
binding = "DB"
database_name = "dotvocab"
database_id = "a2babb4b-9845-4197-8e8a-bc2b30979008"

[[kv_namespaces]]
binding = "AUDIO"
id = "ae50b24969b04bfcb294fd0a9dc1d471"
preview_id = "3daa21a33c414fe79292981ab8fa2ee9"
