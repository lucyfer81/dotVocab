name = "dotvocab"
main = "src/index.ts"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"

[[d1_databases]]
binding = "DB"
database_name = "dotvocab"
database_id = "REPLACE_AFTER_D1_CREATE"

[vars]
ADMIN_TOKEN = "test-admin-token"
